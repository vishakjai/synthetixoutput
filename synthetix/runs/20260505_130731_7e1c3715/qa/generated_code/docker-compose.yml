version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ['5432:5432']
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 3s
      retries: 10
  chat:
    build: ./chat
    image: synthetix-preview/chat:latest
    ports: ['8081:8080']
    environment:
      PORT: '8080'
      JWT_SIGNING_KEY: dev-only-replace-in-prod-with-32-byte-secret
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  notification:
    build: ./notification
    image: synthetix-preview/notification:latest
    ports: ['8082:8080']
    environment:
      PORT: '8080'
      JWT_SIGNING_KEY: dev-only-replace-in-prod-with-32-byte-secret
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  user:
    build: ./user
    image: synthetix-preview/user:latest
    ports: ['8083:8080']
    environment:
      PORT: '8080'
      JWT_SIGNING_KEY: dev-only-replace-in-prod-with-32-byte-secret
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata: {}
